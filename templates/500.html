{% extends "base.html" %}

{% block title %}Server Error{% endblock %}

{% block content %}
<div class="container container-narrow" style="padding: 5rem 1.5rem; text-align: center;">
  <div style="font-size: 4rem; margin-bottom: 1rem;">⚠️</div>
  <h1 class="brand-font" style="font-size: 2.5rem; margin-bottom: 0.5rem;">500 - Kitchen Interruption</h1>
  <p style="color: var(--text-muted); font-size: 1.1rem; margin-bottom: 2rem;">
    Something unexpected occurred in our kitchen backend. Please try again in a moment.
  </p>
  <a href="{{ url_for('user.menu_view') }}" class="btn btn-primary btn-lg">
    Back to Home
  </a>
</div>
{% endblock %}
