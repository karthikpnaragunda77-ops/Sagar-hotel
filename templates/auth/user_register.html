{% extends "base.html" %}

{% block title %}Create Account{% endblock %}

{% block content %}
<div class="container container-narrow" style="padding-top: 3rem; padding-bottom: 4rem;">
  <div class="card" style="box-shadow: var(--shadow-lg); border-radius: var(--radius-xl); padding: 2.5rem 2rem;">
    <div style="text-align: center; margin-bottom: 2rem;">
      <div style="width: 56px; height: 56px; background: var(--success-light); color: var(--success); border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 1rem;">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg>
      </div>
      <h2 style="font-size: 1.75rem; margin-bottom: 0.25rem;">Create Diner Account</h2>
      <p style="color: var(--text-muted); font-size: 0.95rem;">Join us for seamless table ordering and order tracking</p>
    </div>

    <form method="POST" action="{{ url_for('auth.user_register') }}">
      <div class="form-group">
        <label class="form-label" for="name">Full Name</label>
        <input type="text" id="name" name="name" class="form-control" placeholder="e.g. Arjun Sharma" required autofocus>
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input type="email" id="email" name="email" class="form-control" placeholder="e.g. arjun@example.com" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="phone">Phone Number (Optional)</label>
        <input type="tel" id="phone" name="phone" class="form-control" placeholder="e.g. 9876543210">
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" name="password" class="form-control" placeholder="Minimum 6 characters" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="confirm_password">Confirm Password</label>
        <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Repeat password" required>
      </div>

      <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 1rem;">
        Complete Registration 🚀
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid var(--border-color); font-size: 0.9rem; color: var(--text-muted);">
      Already have an account? 
      <a href="{{ url_for('auth.user_login') }}" style="font-weight: 700;">Sign In</a>
    </div>
  </div>
</div>
{% endblock %}
