{% extends "base.html" %}

{% block title %}Customer Login{% endblock %}

{% block content %}
<div class="container container-narrow" style="padding-top: 3rem; padding-bottom: 4rem;">
  <div class="card" style="box-shadow: var(--shadow-lg); border-radius: var(--radius-xl); padding: 2.5rem 2rem;">
    <div style="text-align: center; margin-bottom: 2rem;">
      <div style="width: 56px; height: 56px; background: var(--primary-light); color: var(--primary); border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 1rem;">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
      </div>
      <h2 style="font-size: 1.75rem; margin-bottom: 0.25rem;">Customer Sign In</h2>
      <p style="color: var(--text-muted); font-size: 0.95rem;">Track your breakfast orders and earn morning rewards!</p>
    </div>

    <form method="POST" action="{{ url_for('auth.user_login') }}">
      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input type="email" id="email" name="email" class="form-control" placeholder="e.g. arjun@example.com" required autofocus>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 1rem;">
        Sign In to Breakfast 🥞
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid var(--border-color); font-size: 0.9rem; color: var(--text-muted);">
      Don't have an account yet? 
      <a href="{{ url_for('auth.user_register') }}" style="font-weight: 700;">Create Account</a>
    </div>

    <div style="text-align: center; margin-top: 1rem; font-size: 0.85rem;">
      <a href="{{ url_for('user.menu_view') }}" style="color: var(--text-muted);">← Continue as Guest to Menu</a>
    </div>
  </div>
</div>
{% endblock %}
