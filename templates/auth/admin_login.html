<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal Login | Smart Breakfast Hotel</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
  <style>
    body {
      background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%);
      color: #F8FAFC;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .admin-login-card {
      background: #1E293B;
      border: 1px solid #334155;
      border-radius: var(--radius-xl);
      padding: 2.5rem;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    .admin-login-card .form-control {
      background: #0F172A;
      border-color: #334155;
      color: #FFFFFF;
    }
    .admin-login-card .form-control:focus {
      border-color: #F59E0B;
      box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.2);
    }
    .admin-login-card .form-label {
      color: #CBD5E1;
    }
    .admin-badge {
      background: rgba(245, 158, 11, 0.15);
      color: #F59E0B;
      border: 1px solid rgba(245, 158, 11, 0.3);
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      display: inline-block;
      margin-bottom: 0.75rem;
    }
  </style>
</head>
<body>

  <div class="admin-login-card">
    <div style="text-align: center; margin-bottom: 2rem;">
      <span class="admin-badge">Staff & Kitchen Portal</span>
      <h1 style="font-size: 1.6rem; color: #FFFFFF; margin-bottom: 0.35rem;">Hotel Management</h1>
      <p style="color: #94A3B8; font-size: 0.9rem;">Sign in to manage kitchen orders, dishes, and tables.</p>
    </div>

    <!-- Flash Messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }}" style="margin-bottom: 1.25rem;">
            <span>{{ message }}</span>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('auth.admin_login') }}">
      <div class="form-group">
        <label class="form-label" for="email">Admin Email</label>
        <input type="email" id="email" name="email" class="form-control" value="admin@hotel.com" required autofocus>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" name="password" class="form-control" value="admin123" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 1.25rem; background: #D97706; border: none;">
        Enter Control Center ⚡
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem;">
      <a href="{{ url_for('user.menu_view') }}" style="color: #64748B; font-size: 0.85rem;">← Return to Customer Menu</a>
    </div>
  </div>

</body>
</html>
