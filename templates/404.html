{% extends "base.html" %}

{% block title %}Page Not Found{% endblock %}

{% block content %}
<div class="container container-narrow" style="padding: 5rem 1.5rem; text-align: center;">
  <div style="font-size: 4rem; margin-bottom: 1rem;">🍳</div>
  <h1 class="brand-font" style="font-size: 2.5rem; margin-bottom: 0.5rem;">404 - Page Not Found</h1>
  <p style="color: var(--text-muted); font-size: 1.1rem; margin-bottom: 2rem;">
    The breakfast page or table you are looking for does not exist.
  </p>
  <a href="{{ url_for('user.menu_view') }}" class="btn btn-primary btn-lg">
    Return to Breakfast Menu
  </a>
</div>
{% endblock %}
